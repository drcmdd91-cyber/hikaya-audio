name: Studio pipeline preflight
on:
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-preflight.yml'
  workflow_dispatch:
jobs:
  test-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test valid and invalid projects
        run: python studio/test_preflight.py
