name: Full Korea Arabic four-part production
on:
  push:
    branches: [main]
    paths: ['.github/workflows/korea-full-arabic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install pillow arabic-reshaper python-bidi
      - name: Retrieve original footage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input output
          gh run download 43092526915 --repo "${{ github.repository }}" --dir input
          find input -name video_no_english_narrator.mp4 -size +1M | head -n 1 > source_path.txt
          test -s source_path.txt
      - name: Retrieve faithful Arabic narration
        run: |
          curl -fL --retry 4 -o n1.wav 'https://resource2.heygen.ai/text_to_speech/86c720500b404584a403681de2affebc/dc4ee8e4f0bc4099ad5be2a8431ca556/id=a49ec478166649d5b95339f1548c1464.wav'
          curl -fL --retry 4 -o n2.wav 'https://resource2.heygen.ai/text_to_speech/86c720500b404584a403681de2affebc/dc4ee8e4f0bc4099ad5be2a8431ca556/id=d90bfa7f799743eaaae9be534b0aed9b.wav'
          curl -fL --retry 4 -o n3.wav 'https://resource2.heygen.ai/text_to_speech/86c720500b404584a403681de2affebc/dc4ee8e4f0bc4099ad5be2a8431ca556/id=c5b8f01ebd6b40b6bee214cec313a6f8.wav'
          printf "file 'n1.wav'\nfile 'n2.wav'\nfile 'n3.wav'\n" > audio.txt
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i audio.txt -af "atempo=0.953" -ar 48000 -ac 2 narration.wav
          curl -fL --retry 4 -o folmar_question.wav 'https://resource2.heygen.ai/text_to_speech/86c720500b404584a403681de2affebc/24c7556125674f17bc2c4904074827e5/id=f237d144965c4bc6b2625d6743390f69.wav'
          curl -fL --retry 4 -o daniels_answer.wav 'https://resource2.heygen.ai/text_to_speech/86c720500b404584a403681de2affebc/dc4ee8e4f0bc4099ad5be2a8431ca556/id=87ea5cf605f747f487a9bc2023a3a981.wav'
          curl -fL --retry 4 -o folmar_bandits.wav 'https://resource2.heygen.ai/text_to_speech/86c720500b404584a403681de2affebc/24c7556125674f17bc2c4904074827e5/id=49ace9399d0d41bf9a77cd6f19c3816a.wav'
          ffmpeg -y -hide_banner -loglevel error -i narration.wav -i folmar_question.wav -i daniels_answer.wav -i folmar_bandits.wav -filter_complex "[0:a]volume=0.95[n];[1:a]highpass=f=350,lowpass=f=3200,volume=2.3,adelay=48000|48000[q];[2:a]highpass=f=350,lowpass=f=3200,volume=2.3,adelay=54000|54000[d];[3:a]highpass=f=350,lowpass=f=3200,volume=2.3,adelay=91000|91000[b];[n][q][d][b]amix=inputs=4:duration=first:normalize=0[a]" -map "[a]" -ar 48000 -ac 2 narration_radio.wav
          mv narration_radio.wav narration.wav
      - name: Render four contiguous vertical video parts
        run: |
          SRC="$(cat source_path.txt)"
          for N in 1 2 3 4; do
            START=$(( (N-1)*124 ))
            ffmpeg -y -hide_banner -loglevel error -ss "$START" -i "$SRC" -i narration.wav -t 124 -filter_complex "[0:v]fps=24,scale=720:1050:force_original_aspect_ratio=increase,crop=720:1050,setsar=1,pad=720:1280:0:115:color=0x101923,drawbox=x=0:y=0:w=iw:h=115:color=0x14283a:t=fill,drawbox=x=0:y=1165:w=iw:h=115:color=0x14283a:t=fill,drawtext=font='Noto Sans Arabic':text='دفتر الحكايات':fontcolor=white:fontsize=42:x=(w-text_w)/2:y=24,drawtext=font='Noto Sans Arabic':text='الحرب الكورية - الجزء $N':fontcolor=0xffd166:fontsize=28:x=(w-text_w)/2:y=1195[v];[0:a]volume=0.24[bg];[1:a]atrim=start=${START}:duration=124,asetpts=PTS-STARTPTS,volume=1.4[voice];[bg][voice]amix=inputs=2:duration=first:weights='0.35 1'[a]" -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "output/korea_full_part_${N}.mp4"
          done
          for F in output/*.mp4; do ffprobe -v error -show_entries format=duration -of default=nw=1 "$F"; done
      - uses: actions/upload-artifact@v4
        with:
          name: korea-four-full-arabic-parts
          path: output/*.mp4
          retention-days: 7
