name: Remove narrator (Demucs)
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL of authorized footage (direct MP4 preferred)'
        required: true
        type: string
      rights_confirmed:
        description: 'I have permission to download and edit this footage'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  clean-audio:
    if: ${{ inputs.rights_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install 'demucs==4.0.1' 'yt-dlp>=2025.1.0'
      - name: Separate audio (no subtitles or text)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: python process_video.py --source "$VIDEO_URL" --authorized
      - uses: actions/upload-artifact@v4
        with:
          name: background-and-video
          path: |
            output/stems/htdemucs/original/no_vocals.mp3
            output/video_no_english_narrator.mp4
          retention-days: 7
