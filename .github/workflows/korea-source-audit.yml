name: Korea source shot audit (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  index-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Recover separated source from existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download 43092526915 --repo "${{ github.repository }}" --dir input
          find input -type f -maxdepth 4
      - name: Generate timecoded scene index and visual contact sheet
        run: |
          mkdir -p audit
          VIDEO="$(find input -type f -name video_no_english_narrator.mp4 | head -n1)"
          test -s "$VIDEO"
          python studio/scene_index.py "$VIDEO" audit/shot_index.json
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json "$VIDEO" > audit/source_info.json
          ffmpeg -y -hide_banner -loglevel error -i "$VIDEO" -vf "fps=1/10,scale=320:-1,drawtext=text='%{pts\\:hms}':x=8:y=8:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.6,tile=6x6" -frames:v 1 audit/contact_sheet_0.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: korea-source-audit
          path: audit/
          retention-days: 7
